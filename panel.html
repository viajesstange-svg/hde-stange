<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de horas de espera y bodegaje de Transportes Stange, con la descarga del Excel de cobro GTI.">
  <title>Panel de cobros GTI</title>
  <link rel="icon" href="icono-192.png" sizes="192x192">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Archivo:wght@400;500&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: Wayfind × Formwork (by request: mezcla B) · seed app-movil-conductores-camion-28ee·f196c768·2026-11-21·r0
 * nav: ink plate top bar, wordmark and one quiet action · signature: the waiting-time ticket, the driver's WhatsApp message set as a stamped departure slip · states: loading, empty, error, pending, full · ground: cool grey
 * axes: light/condensed-grotesk/safety-orange · posture: committed · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: E, orange kept to the send and download actions, the form's edge, the stamp and the amount to bill */

/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --color-error: oklch(50% 0.19 27); --color-error-soft: oklch(95% 0.03 27);
  --container: 1240px; --container-narrow: 560px; --gutter: 32px;
  --z-sticky: 200; --z-modal: 400; --z-toast: 500;
  --color-paper: oklch(95.5% 0.006 250); --color-paper-2: oklch(91% 0.009 250); --color-paper-3: oklch(87% 0.01 250);
  --color-surface: oklch(99.5% 0.005 250);
  --color-ink: oklch(16% 0.014 262); --color-ink-2: oklch(30% 0.014 262); --color-muted: oklch(47% 0.016 260);
  --color-rule: oklch(80% 0.011 250);
  --color-accent: oklch(66% 0.21 38); --color-accent-deep: oklch(60% 0.2 38); --color-accent-text: oklch(50% 0.18 38);
  --color-accent-soft: oklch(93% 0.045 50); --color-accent-ink: oklch(16% 0.014 262);
  --color-on-ink: oklch(95.5% 0.006 250); --color-on-ink-muted: oklch(75% 0.012 250);
  --color-focus: oklch(55% 0.2 38);
  --color-scrim: oklch(16% 0.014 262 / 0.5);
  --font-display: "Oswald", "Arial Narrow", ui-sans-serif, sans-serif;
  --font-body: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-outlier: "Chivo Mono", ui-monospace, monospace;
  --radius-card: 0; --radius-input: 0; --radius-pill: 0; --rule-hair: 1px; --rule-bar: 2px;
  --tracking-display: 0;
  --control: 52px; --control-app: 40px;
}
@media (max-width: 40rem) { :root { --gutter: 16px; } }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); }
body { margin: 0; min-height: 100vh; background: var(--color-paper); color: var(--color-ink);
  font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent-deep); }
::selection { background: var(--color-accent-soft); color: var(--color-ink); }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
a { color: var(--color-accent-text); text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-synthesis: none; letter-spacing: var(--tracking-display);
  line-height: 1.05; overflow-wrap: break-word; min-width: 0; text-wrap: balance; color: var(--color-ink); }
h1 { font-size: var(--text-3xl); } h2 { font-size: var(--text-xl); font-weight: 500; } h3 { font-size: var(--text-lg); line-height: 1.2; }
p { margin: 0; text-wrap: pretty; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; }
.muted { color: var(--color-muted); }
.small { font-size: var(--text-sm); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.wrap--narrow { max-width: var(--container-narrow); }
.stack > * + * { margin-top: var(--space-md); }

/* ---------- top bar: ink plate ---------- */
.bar { position: sticky; top: 0; z-index: var(--z-sticky); background: var(--color-ink); color: var(--color-on-ink); }
.bar__in { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: 56px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); color: var(--color-on-ink); text-decoration: none; white-space: nowrap; }
.bar__side { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); color: var(--color-on-ink-muted); white-space: nowrap; }
@media (max-width: 26rem) { .wordmark { font-size: var(--text-md); } }
.net { font-size: var(--text-sm); color: var(--color-on-ink-muted); font-family: var(--font-outlier); }
.net[data-state="online"] { color: var(--color-accent); }
.net[data-state="offline"], .net[data-state="pending"] { color: var(--color-on-ink); }
.bar .link { color: var(--color-on-ink); text-decoration-color: var(--color-accent); }
.bar .link:hover { color: var(--color-accent); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control); padding: 0 var(--space-lg);
  border: var(--rule-bar) solid var(--color-ink); border-radius: var(--radius-input); background: transparent; color: var(--color-ink);
  font: 500 var(--text-md) var(--font-body); cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: 3px 3px 0 var(--color-ink);
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper-2); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--color-ink); }
.btn:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.btn:disabled, .btn[aria-busy="true"] { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--color-accent); color: var(--color-accent-ink); font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); }
.btn--primary:hover { background: var(--color-accent-deep); }
.btn--block { width: 100%; }
.btn--sm { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-sm); box-shadow: 2px 2px 0 var(--color-ink); border-width: 1.5px; }
.btn--sm:active { transform: translate(2px, 2px); }
.link { background: none; border: 0; padding: var(--space-xs) 0; min-height: 44px; color: var(--color-ink); font: 500 var(--text-sm) var(--font-body);
  cursor: pointer; text-decoration: underline; text-decoration-color: var(--color-accent); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
.link:hover { color: var(--color-accent-text); }
.link:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

/* ---------- fields ---------- */
.field { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.field label, .label { font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); }
.field .help { min-height: 1lh; font-size: var(--text-sm); color: var(--color-muted); }
.input { width: 100%; min-height: var(--control); padding: 0 var(--space-md); border: var(--rule-bar) solid var(--color-ink); border-radius: var(--radius-input);
  background: var(--color-surface); color: var(--color-ink); font-size: max(16px, var(--text-md));
  transition: background-color var(--dur-micro) var(--ease-out); }
.input:hover { background: var(--color-paper); }
.input:focus-visible { outline: 3px solid var(--color-focus); outline-offset: -3px; }
.input[aria-invalid="true"] { border-color: var(--color-error); background: var(--color-error-soft); }
.input:disabled { opacity: 0.55; cursor: not-allowed; }
.input--mono { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; }
select.input { appearance: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-md); }
@media (max-width: 22rem) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- tray: the form panel, orange edge ---------- */
.tray { position: relative; padding: var(--space-lg) var(--space-md); background: var(--color-paper-2); box-shadow: inset 4px 0 0 var(--color-accent); padding-left: var(--space-lg); }

/* ---------- surfaces ---------- */
.card { background: var(--color-surface); border: var(--rule-bar) solid var(--color-ink); padding: var(--space-lg); }

/* ---------- the ticket (signature) ---------- */
.ticket { position: relative; background: var(--color-surface); border: var(--rule-bar) solid var(--color-ink); box-shadow: 4px 4px 0 var(--color-ink);
  font-family: var(--font-outlier); font-variant-numeric: tabular-nums; color: var(--color-ink); overflow: hidden; }
.ticket__body { padding: var(--space-md) var(--space-md) var(--space-sm); display: grid; gap: var(--space-2xs); }
.ticket__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-sm); font-size: var(--text-lg); font-weight: 500; }
.ticket__row { display: flex; justify-content: space-between; gap: var(--space-sm); font-size: var(--text-sm); }
.ticket__row span:first-child { color: var(--color-muted); }
.ticket__total { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--space-xs); margin-top: var(--space-2xs);
  border-top: var(--rule-bar) solid var(--color-ink); font-size: var(--text-xl); font-weight: 500; }
.ticket__stub { border-top: 2px dashed var(--color-rule); padding: var(--space-xs) var(--space-md); font-size: var(--text-xs); color: var(--color-muted);
  display: flex; justify-content: space-between; gap: var(--space-sm); background: var(--color-paper); }
.ticket--empty .ticket__head, .ticket--empty .ticket__total { color: var(--color-muted); }
.stamp { justify-self: end; margin-top: var(--space-xs); transform: rotate(-4deg); padding: var(--space-2xs) var(--space-sm);
  border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: 2px; color: var(--color-accent-text);
  font: 500 var(--text-sm) var(--font-outlier); background: var(--color-surface); pointer-events: none; }
.stamp--pending { color: var(--color-muted); }
.stamp[data-land] { animation: land var(--dur-short) var(--ease-out); }
@keyframes land { from { opacity: 0; transform: rotate(-4deg) scale(1.25); } to { opacity: 1; transform: rotate(-4deg) scale(1); } }

/* ---------- small list of tickets ---------- */
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: var(--rule-bar) solid var(--color-ink); }
.mini li { border-bottom: var(--rule-hair) solid var(--color-rule); padding: var(--space-sm) 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3xs) var(--space-sm); font-size: var(--text-sm); }
.mini .mono { font-size: var(--text-sm); }
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 var(--space-xs); border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 500; background: var(--color-accent-soft); color: var(--color-accent-text); white-space: nowrap; }
.tag--grey { background: var(--color-paper-3); color: var(--color-ink-2); }
.tag--line { background: none; box-shadow: inset 0 0 0 1px var(--color-ink); color: var(--color-ink-2); }

/* ---------- notices ---------- */
.notice { padding: var(--space-sm) var(--space-md); font-size: var(--text-sm); background: var(--color-paper-3); color: var(--color-ink); }
.notice--error { background: var(--color-error-soft); color: var(--color-error); box-shadow: inset 4px 0 0 var(--color-error); }
.notice--ok { background: var(--color-accent-soft); color: var(--color-ink); box-shadow: inset 4px 0 0 var(--color-accent); }

/* ---------- loading skeleton ---------- */
.skeleton { display: block; height: 52px; background: linear-gradient(90deg, var(--color-paper-2), var(--color-paper-3), var(--color-paper-2));
  background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.skeleton + .skeleton { margin-top: var(--space-sm); }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: var(--space-lg); z-index: var(--z-toast); transform: translateX(-50%); max-width: min(92vw, 420px);
  padding: var(--space-sm) var(--space-md); background: var(--color-ink); color: var(--color-on-ink); font-size: var(--text-sm);
  box-shadow: inset 4px 0 0 var(--color-accent); }

/* ---------- table (admin) ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th, td { padding: var(--space-xs) var(--space-sm); text-align: left; border-bottom: var(--rule-hair) solid var(--color-rule); white-space: nowrap; vertical-align: middle; }
th { font-weight: 500; color: var(--color-muted); border-bottom: var(--rule-bar) solid var(--color-ink); }
td.num, th.num { text-align: right; }
tbody tr:hover td { background: var(--color-paper-2); }
tr[data-estado="ANULADA"] td { color: var(--color-muted); text-decoration: line-through; }
tr[data-estado="EN CURSO"] td:first-child { box-shadow: inset 4px 0 0 var(--color-accent); }

/* ---------- dialog ---------- */
dialog { border: var(--rule-bar) solid var(--color-ink); padding: 0; width: min(620px, 94vw); background: var(--color-paper); color: var(--color-ink); box-shadow: 6px 6px 0 var(--color-ink); }
dialog::backdrop { background: var(--color-scrim); }

/* ---------- motion safety ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

  <style>
    :root { --control: var(--control-app); --container: 1840px; --gutter: 24px; }
    td, th { padding-inline: var(--space-xs); }
    main { padding-block: var(--space-lg) var(--space-2xl); }
    .tabs { display: flex; gap: var(--space-2xs); border-bottom: var(--rule-bar) solid var(--color-ink); margin-bottom: var(--space-lg); overflow-x: auto; }
    .tab { min-height: 44px; padding: 0 var(--space-md); border: 0; background: none; color: var(--color-muted); font: 500 var(--text-md) var(--font-body);
      cursor: pointer; box-shadow: inset 0 -2px 0 transparent; transition: color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out); white-space: nowrap; }
    .tab:hover { color: var(--color-ink); }
    .tab[aria-selected="true"] { color: var(--color-ink); box-shadow: inset 0 -4px 0 var(--color-accent); }
    .tab:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
    .filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)) auto auto auto; gap: var(--space-sm); align-items: end; margin-bottom: var(--space-lg); }
    @media (max-width: 60rem) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filters .field:first-child { grid-column: 1 / -1; } }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-lg); margin-bottom: var(--space-lg); padding-bottom: var(--space-lg); border-bottom: var(--rule-hair) solid var(--color-rule); }
    @media (max-width: 60rem) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .stat dt { font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; }
    .stat dd { margin: var(--space-2xs) 0 0; font-family: var(--font-display); font-weight: 700; font-size: var(--text-2xl); letter-spacing: var(--tracking-display); font-variant-numeric: tabular-nums; }
    .stat--accent { background: var(--color-ink); padding: var(--space-xs) var(--space-sm); }
    .stat--accent dt { color: var(--color-on-ink-muted); }
    .stat--accent dd { color: var(--color-accent); font-family: var(--font-outlier); font-weight: 500; }
    .login { max-width: 400px; margin: var(--space-2xl) auto; }
    .acc { display: flex; gap: var(--space-2xs); justify-content: flex-end; }
    .empty { padding: var(--space-xl) var(--space-md); text-align: center; color: var(--color-muted); white-space: normal; }
    .dlg__in { padding: var(--space-lg); display: grid; gap: var(--space-md); }
    .dlg__foot { display: flex; justify-content: flex-end; gap: var(--space-sm); }
    .result { margin-bottom: var(--space-lg); }
    @media (max-width: 40rem) {
      thead { display: none; }
      tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: var(--space-sm) 0; border-bottom: var(--rule-hair) solid var(--color-rule); }
      tbody td { border: 0; padding: var(--space-3xs) 0; white-space: normal; }
      tbody td[data-hide-sm] { display: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="wrap bar__in">
      <span class="wordmark">Transportes Stange</span>
      <div class="bar__side"><span>Cobros GTI</span><button type="button" class="link" id="btnSalir" hidden>Salir</button></div>
    </div>
  </header>

  <main class="wrap">
    <div id="aviso" class="notice notice--error result" role="alert" hidden></div>

    <section id="vLogin" class="login" aria-labelledby="tLogin">
      <h1 id="tLogin" style="margin-bottom: var(--space-md)">Panel de cobros</h1>
      <form id="fLogin" class="tray stack" novalidate>
        <div class="field">
          <label for="pin">PIN de administrador</label>
          <input class="input input--mono" id="pin" name="pin" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="btnLogin">Entrar</button>
      </form>
    </section>

    <section id="vPanel" hidden aria-labelledby="tPanel">
      <h1 id="tPanel" class="visually-hidden">Registros del período</h1>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tipo="HDE" aria-selected="true">Horas de espera</button>
        <button type="button" class="tab" role="tab" data-tipo="Bodegaje" aria-selected="false">Bodegaje</button>
      </div>

      <div class="filters">
        <div class="field"><label for="selPeriodo">Período de cobro</label><select class="input" id="selPeriodo"></select></div>
        <div class="field"><label for="desde">Desde</label><input class="input input--mono" id="desde" type="date"></div>
        <div class="field"><label for="hasta">Hasta</label><input class="input input--mono" id="hasta" type="date"></div>
        <button type="button" class="btn" id="btnActualizar">Actualizar</button>
        <button type="button" class="btn" id="btnNuevo">Nuevo registro</button>
        <button type="button" class="btn btn--primary" id="btnExportar">Descargar Excel GTI</button>
      </div>

      <div id="resultado" class="notice notice--ok result" role="status" hidden></div>

      <dl class="stats">
        <div class="stat"><dt>Registros terminados</dt><dd id="rCant">0</dd></div>
        <div class="stat"><dt>Total horas</dt><dd id="rHoras">0:00</dd></div>
        <div class="stat stat--accent"><dt>Total a cobrar</dt><dd id="rMonto">$0</dd></div>
        <div class="stat"><dt>Sin término</dt><dd id="rCurso">0</dd></div>
      </dl>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Fecha</th><th>DT</th><th>Equipo</th><th>Conductor</th><th>Depósito</th><th>Localidad</th>
            <th>Inicio</th><th>Término</th><th class="num">Horas</th><th class="num">Monto</th><th>Estado</th><th><span class="visually-hidden">Acciones</span></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="dlg" aria-labelledby="dlgTitulo">
    <form id="fDlg" class="dlg__in" method="dialog" novalidate>
      <h2 id="dlgTitulo">Registro</h2>
      <div class="grid2">
        <div class="field"><label for="eFecha">Fecha</label><input class="input input--mono" id="eFecha" type="date" required></div>
        <div class="field"><label for="eDoc">Documento de transporte</label><input class="input input--mono" id="eDoc" inputmode="numeric" required></div>
        <div class="field"><label for="eEquipo">Equipo</label><input class="input input--mono" id="eEquipo" list="dlEquipos" required></div>
        <div class="field"><label for="eConductor">Conductor</label><input class="input" id="eConductor" list="dlConductores" required></div>
        <div class="field"><label for="eDeposito">Depósito</label><input class="input input--mono" id="eDeposito" list="dlDepositos" required></div>
        <div class="field"><label for="eLocalidad">Localidad</label><input class="input" id="eLocalidad" list="dlLocalidades" required></div>
        <div class="field"><label for="eInicio">Día y hora de inicio</label><input class="input input--mono" id="eInicio" type="datetime-local" required></div>
        <div class="field"><label for="eTermino">Día y hora de término</label><input class="input input--mono" id="eTermino" type="datetime-local"><span class="help">Vacío si el equipo sigue estacionado.</span></div>
      </div>
      <div class="field"><label for="eObs">Observación</label><input class="input" id="eObs"></div>
      <p class="muted small" id="eInfo"></p>
      <div class="dlg__foot">
        <button type="button" class="btn" id="dlgCancelar">Cancelar</button>
        <button type="submit" class="btn btn--primary" id="dlgGuardar">Guardar</button>
      </div>
    </form>
  </dialog>
  <datalist id="dlEquipos"></datalist><datalist id="dlConductores"></datalist>
  <datalist id="dlLocalidades"></datalist><datalist id="dlDepositos"></datalist>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="wrap">Activa JavaScript para usar el panel.</p></noscript>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var st = { pin: '', tipo: 'HDE', cfg: null, datos: [], editando: null, periodos: [] };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function aDate(s) { var p = s.split(/[-T:]/); return new Date(+p[0], p[1] - 1, +p[2], +p[3] || 0, +p[4] || 0); }
  function fmt(s) { if (!s) return ''; var p = s.split(/[-T:]/); return p[2] + '-' + p[1] + '-' + p[0] + (p[3] ? ' ' + p[3] + ':' + p[4] : ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 4000); }
  function aviso(m) { $('aviso').textContent = m || ''; $('aviso').hidden = !m; }
  // Dentro de Google usa google.script.run; publicada como página web propia usa APP_URL (config.js).
  function api(fn) {
    var a = Array.prototype.slice.call(arguments, 1);
    if (window.google && google.script && google.script.run) {
      return new Promise(function (ok, ko) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko); r[fn].apply(r, a); });
    }
    if (!window.APP_URL) return Promise.reject(new Error('Falta configurar APP_URL en config.js.'));
    return fetch(window.APP_URL, { method: 'POST', redirect: 'follow', credentials: 'omit',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: a }) })
      .then(function (r) { if (!r.ok) throw new Error('NetworkError HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
  }
  function msg(e) { return (e && e.message) || String(e); }
  function hm(min) { return Math.floor(min / 60) + ':' + pad(Math.round(min % 60)); }
  function minutos(r) { return r.termino ? (aDate(r.termino) - aDate(r.inicio)) / 60000 : 0; }
  function clp(n) { return '$' + Math.round(n).toLocaleString('es-CL'); }
  function ahoraLocal() { var d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  var historial = (window.google && google.script && google.script.history) || null;
  var urlApi = (window.google && google.script && google.script.url) || null;

  /* ---------- períodos: del día siguiente al corte hasta el día de corte del mes siguiente ---------- */
  function periodos() {
    var corte = st.cfg.diaCorte || 19, hoy = new Date(), out = [];
    var mesFin = hoy.getDate() > corte ? new Date(hoy.getFullYear(), hoy.getMonth() + 1, 1) : new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    for (var i = 0; i < 14; i++) {
      var fin = new Date(mesFin.getFullYear(), mesFin.getMonth() - i, corte);
      var ini = new Date(fin.getFullYear(), fin.getMonth() - 1, corte + 1);
      out.push({ nombre: MESES[ini.getMonth()] + (ini.getFullYear() !== fin.getFullYear() ? ' ' + ini.getFullYear() : '') + ' y ' + MESES[fin.getMonth()] + ' ' + fin.getFullYear(),
                 desde: ymd(ini), hasta: ymd(fin) });
    }
    return out;
  }
  function elegirPeriodo(i) {
    var p = st.periodos[i]; if (!p) return;
    $('selPeriodo').value = i; $('desde').value = p.desde; $('hasta').value = p.hasta;
  }
  function guardarUrl() {
    if (historial) historial.replace(null, { tipo: st.tipo, p: $('selPeriodo').value });
  }

  /* ---------- login ---------- */
  $('fLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('pin').value.trim();
    if (!pin) { $('pin').setAttribute('aria-invalid', 'true'); $('pin').focus(); return; }
    $('btnLogin').setAttribute('aria-busy', 'true');
    api('adminLogin', pin).then(function (cfg) {
      st.pin = pin; st.cfg = cfg; aviso('');
      try { sessionStorage.setItem('adm_pin', pin); } catch (x) {}
      [['dlEquipos', cfg.equipos], ['dlConductores', cfg.conductores], ['dlLocalidades', cfg.localidades], ['dlDepositos', cfg.depositos]].forEach(function (d) {
        $(d[0]).innerHTML = d[1].map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
      });
      st.periodos = periodos();
      $('selPeriodo').innerHTML = st.periodos.map(function (p, i) {
        return '<option value="' + i + '">' + esc(p.nombre) + ', ' + fmt(p.desde) + ' al ' + fmt(p.hasta) + (i === 0 ? ' (en curso)' : '') + '</option>';
      }).join('');
      var hoy = new Date().getDate(), corte = cfg.diaCorte || 19;
      var porDefecto = (hoy > corte && hoy <= corte + 3) ? 1 : 0;
      $('vLogin').hidden = true; $('vPanel').hidden = false; $('btnSalir').hidden = false;
      var arrancar = function (loc) {
        var q = (loc && loc.parameter) || {};
        if (q.tipo === 'Bodegaje' || q.tipo === 'HDE') marcarTab(q.tipo);
        elegirPeriodo(q.p !== undefined && st.periodos[+q.p] ? +q.p : porDefecto);
        listar();
      };
      if (urlApi) urlApi.getLocation(arrancar); else arrancar(null);
    }, function (err) {
      $('pin').setAttribute('aria-invalid', 'true'); $('pin').focus(); aviso(msg(err));
    }).then(function () { $('btnLogin').removeAttribute('aria-busy'); });
  });
  $('pin').addEventListener('input', function () { this.removeAttribute('aria-invalid'); });
  $('btnSalir').addEventListener('click', function () { try { sessionStorage.removeItem('adm_pin'); } catch (x) {} location.reload(); });
  try { var g = sessionStorage.getItem('adm_pin'); if (g) { $('pin').value = g; $('fLogin').requestSubmit(); } } catch (x) {}

  /* ---------- pestañas y filtros ---------- */
  function marcarTab(tipo) {
    st.tipo = tipo;
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.tipo === tipo)); });
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { marcarTab(t.dataset.tipo); guardarUrl(); listar(); });
  });
  $('selPeriodo').addEventListener('change', function () { elegirPeriodo(+this.value); guardarUrl(); listar(); });
  $('btnActualizar').addEventListener('click', listar);

  /* ---------- listado con estados ---------- */
  function filaEstado(html) { $('tbody').innerHTML = '<tr><td colspan="12" class="empty">' + html + '</td></tr>'; }
  function listar() {
    aviso(''); $('resultado').hidden = true;
    $('tbody').innerHTML = [0, 1, 2, 3].map(function () { return '<tr><td colspan="12"><span class="skeleton"></span></td></tr>'; }).join('');
    api('adminListar', st.pin, st.tipo, $('desde').value, $('hasta').value).then(function (rows) {
      st.datos = rows; pintar();
    }, function (err) {
      filaEstado('No se pudieron cargar los registros: ' + esc(msg(err)) + '. <button type="button" class="link" id="reintentar">Reintentar</button>');
      $('reintentar').addEventListener('click', listar);
    });
  }
  function pintar() {
    var tarifa = st.cfg.tarifas[st.tipo], tot = 0, mins = 0, n = 0, curso = 0;
    if (!st.datos.length) {
      filaEstado(st.tipo === 'HDE' ? 'No hay horas de espera en este período. Las que envíen los conductores aparecerán aquí.'
                                   : 'No hay bodegajes en este período. Usa Nuevo registro cuando un equipo quede estacionado.');
    } else {
      $('tbody').innerHTML = st.datos.map(function (r, i) {
        var m = minutos(r), monto = m / 60 * tarifa;
        if (r.estado === 'TERMINADA') { tot += monto; mins += m; n++; }
        if (r.estado === 'EN CURSO') curso++;
        var tag = r.estado === 'TERMINADA' ? '<span class="tag">Terminada</span>' : r.estado === 'EN CURSO' ? '<span class="tag tag--line">Sin término</span>' : '<span class="tag tag--grey">Anulada</span>';
        if (r.exportado === 'SI') tag += ' <span class="tag tag--grey">Exportada</span>';
        if (r.origen === 'ADMIN') tag += ' <span class="tag tag--line">Manual</span>';
        var acc = '<button type="button" class="btn btn--sm" data-a="editar" data-i="' + i + '">Editar</button>' +
          (r.estado === 'EN CURSO' ? '<button type="button" class="btn btn--sm" data-a="salida" data-i="' + i + '">Marcar salida</button>' : '') +
          (r.estado === 'ANULADA' ? '<button type="button" class="btn btn--sm" data-a="reactivar" data-i="' + i + '">Reactivar</button>'
                                  : '<button type="button" class="btn btn--sm" data-a="anular" data-i="' + i + '">Anular</button>');
        return '<tr data-estado="' + esc(r.estado) + '"><td class="mono">' + fmt(r.fecha) + '</td><td class="mono">' + esc(r.doc) + '</td><td class="mono">' + esc(r.equipo) +
          '</td><td>' + esc(r.conductor) + '</td><td class="mono" data-hide-sm>' + esc(r.deposito) + '</td><td>' + esc(r.localidad) + '</td><td class="mono" data-hide-sm>' + fmt(r.inicio) +
          '</td><td class="mono" data-hide-sm>' + (r.termino ? fmt(r.termino) : '') + '</td><td class="num mono">' + (r.termino ? hm(m) : '') +
          '</td><td class="num mono">' + (r.termino ? clp(monto) : '') + '</td><td>' + tag + '</td><td><div class="acc">' + acc + '</div></td></tr>';
      }).join('');
    }
    $('rCant').textContent = n; $('rHoras').textContent = hm(mins); $('rMonto').textContent = clp(tot); $('rCurso').textContent = curso;
  }
  $('tbody').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var r = st.datos[+b.dataset.i], a = b.dataset.a;
    if (a === 'editar') abrir(r, false);
    if (a === 'salida') abrir(r, true);
    if (a === 'anular') {
      if (!confirm('¿Anular este registro? No se incluirá en el cobro. Puedes reactivarlo después.')) return;
      api('adminAnular', st.pin, st.tipo, r.id).then(function () { toast('Registro anulado.'); listar(); }, function (err) { aviso(msg(err)); });
    }
    if (a === 'reactivar') api('adminReactivar', st.pin, st.tipo, r.id).then(function () { toast('Registro reactivado.'); listar(); }, function (err) { aviso(msg(err)); });
  });

  /* ---------- crear / editar ---------- */
  var REQ = [['eFecha', 'Fecha'], ['eDoc', 'Documento'], ['eEquipo', 'Equipo'], ['eConductor', 'Conductor'], ['eDeposito', 'Depósito'], ['eLocalidad', 'Localidad'], ['eInicio', 'Inicio']];
  function abrir(r, salida) {
    st.editando = r || null;
    $('dlgTitulo').textContent = !r ? (st.tipo === 'HDE' ? 'Nueva hora de espera' : 'Nuevo bodegaje') : (salida ? 'Marcar salida' : 'Editar registro');
    r = r || { fecha: ymd(new Date()), deposito: st.cfg.depositos[0], inicio: ahoraLocal() };
    $('eFecha').value = r.fecha || ''; $('eDoc').value = r.doc || ''; $('eEquipo').value = r.equipo || '';
    $('eConductor').value = r.conductor || ''; $('eDeposito').value = r.deposito || ''; $('eLocalidad').value = r.localidad || '';
    $('eInicio').value = r.inicio || ''; $('eTermino').value = salida ? ahoraLocal() : (r.termino || ''); $('eObs').value = r.obs || '';
    $('eInfo').textContent = r.id ? 'Origen: ' + (r.origen === 'APP' ? 'app del conductor' : r.origen === 'HISTORICO' ? 'archivo histórico' : 'ingreso manual') + (r.exportado === 'SI' ? '. Ya fue incluido en un Excel descargado.' : '.') : '';
    REQ.forEach(function (c) { $(c[0]).removeAttribute('aria-invalid'); });
    $('dlg').showModal();
    (salida ? $('eTermino') : $('eDoc')).focus();
  }
  $('btnNuevo').addEventListener('click', function () { abrir(null, false); });
  $('dlgCancelar').addEventListener('click', function () { $('dlg').close(); });
  $('eInicio').addEventListener('change', function () { if (!st.editando && this.value) $('eFecha').value = this.value.slice(0, 10); });
  $('fDlg').addEventListener('submit', function (e) {
    e.preventDefault();
    var falta = REQ.filter(function (c) { return !$(c[0]).value.trim(); });
    REQ.forEach(function (c) { if (falta.indexOf(c) >= 0) $(c[0]).setAttribute('aria-invalid', 'true'); else $(c[0]).removeAttribute('aria-invalid'); });
    if (falta.length) { $(falta[0][0]).focus(); return; }
    var d = { id: st.editando ? st.editando.id : '', fecha: $('eFecha').value, doc: $('eDoc').value.trim(), equipo: $('eEquipo').value.trim(),
              conductor: $('eConductor').value.trim(), deposito: $('eDeposito').value.trim(), localidad: $('eLocalidad').value.trim(),
              inicio: $('eInicio').value.slice(0, 16), termino: $('eTermino').value.slice(0, 16), obs: $('eObs').value.trim() };
    if (d.termino && aDate(d.termino) <= aDate(d.inicio)) { $('eTermino').setAttribute('aria-invalid', 'true'); $('eTermino').focus(); return; }
    $('dlgGuardar').setAttribute('aria-busy', 'true');
    api('adminGuardar', st.pin, st.tipo, d).then(function () { $('dlg').close(); toast('Guardado.'); listar(); },
      function (err) { $('eInfo').textContent = msg(err); })
      .then(function () { $('dlgGuardar').removeAttribute('aria-busy'); });
  });

  /* ---------- exportar ---------- */
  $('btnExportar').addEventListener('click', function () {
    var d = $('desde').value, h = $('hasta').value;
    var curso = st.datos.filter(function (r) { return r.estado === 'EN CURSO' && r.fecha >= d && r.fecha <= h; }).length;
    var texto = 'Excel de ' + (st.tipo === 'HDE' ? 'horas de espera' : 'bodegaje') + ' del ' + fmt(d) + ' al ' + fmt(h) + '.' +
      (curso ? '\n\nHay ' + curso + ' registro(s) sin término que no se incluirán.' : '') +
      '\n\nAceptar: descargar y marcar como exportados (cierre).\nCancelar: descargar solo como borrador.';
    var marcar = confirm(texto);
    var b = $('btnExportar'); b.setAttribute('aria-busy', 'true'); b.textContent = 'Generando';
    api('adminExportar', st.pin, st.tipo, d, h, marcar).then(function (r) {
      var bin = atob(r.base64), buf = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      var a = document.createElement('a'); a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      $('resultado').innerHTML = esc(r.nombre) + ': ' + r.registros + ' registros, total ' + clp(r.total) +
        '. Si no se descargó, <a href="' + esc(r.urlDrive) + '" target="_blank" rel="noopener">ábrelo en Google Drive</a>.';
      $('resultado').hidden = false;
      if (marcar) listar();
    }, function (err) { aviso(msg(err)); })
      .then(function () { b.removeAttribute('aria-busy'); b.textContent = 'Descargar Excel GTI'; });
  });
})();
</script>
</body>
